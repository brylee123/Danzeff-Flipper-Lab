name: Validate Flipper App
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  native-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test portable input logic
        run: ./tests/run.sh

  build-fap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build against official Flipper release SDK
        uses: flipperdevices/flipperzero-ufbt-action@v0.1
        id: build-app
        with:
          sdk-channel: release
      - name: Upload the compiled FAP
        uses: actions/upload-artifact@v4
        with:
          name: danzeff-lab-fap
          path: ${{ steps.build-app.outputs.fap-artifacts }}
          if-no-files-found: error
